server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types application/javascript application/json application/manifest+json image/svg+xml text/css text/plain;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /runtime-config.json {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }

  location = /catalogo/runtime-config.json {
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /catalogo/index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /links/index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /catalogo {
    return 308 /catalogo/;
  }

  location /catalogo/ {
    try_files $uri $uri/ /catalogo/index.html;
  }

  location = /links {
    return 308 /links/;
  }

  location /links/ {
    try_files $uri $uri/ /links/index.html;
  }

  location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
